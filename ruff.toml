# Lint and format settings. `ruff check .` and `ruff format --check .` are run by CI (.github/workflows/ci.yml).
line-length = 120
target-version = "py312"
# The fonts are generated by process_fonts.py and pyboard.py is MicroPython's own tool. current_sensor is
# the design calculation for the sensor's circuit, not part of the reader.
extend-exclude = ["app/font", "pyboard.py", "current_sensor"]

[lint]
# pycodestyle, pyflakes, import order, bugbear. Not pyupgrade: MicroPython hasn't all of what it would suggest.
select = ["E", "W", "F", "I", "B"]

[lint.per-file-ignores]
# The tests replace functions inside loops, on purpose.
"tests/*" = ["B023"]
